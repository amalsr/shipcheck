# Name shown in the GitHub "Actions" tab
name: CI

# WHEN this workflow runs
on:
  push:
    branches: [main]        # every push/commit to main
  pull_request:
    branches: [main]        # every PR that targets main (and every new commit pushed to that PR)

# WHAT it runs: one or more jobs
jobs:
  build:
    runs-on: ubuntu-latest  # a fresh Linux machine GitHub gives you for free, deleted afterwards

    steps:
      # 1. Download your repo's code onto that machine
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js (and cache npm downloads so later runs are faster)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies exactly as locked in package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Type-check (tsc) + build (vite). If this fails, the workflow fails ❌
      - name: Build
        run: npm run build
